name: Desktop app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, for example 1.0.1 (required when publishing)'
        required: false
      publish:
        description: 'Upload the builds to a draft GitHub Release'
        type: boolean
        default: false
      debug:
        description: 'Show Laravel error pages, stack traces and DevTools in the built app'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      debug: ${{ steps.version.outputs.debug }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH="true"
            # Tag pushes are public releases; run the workflow manually to
            # build (or publish) a debug installer.
            DEBUG="false"
          else
            VERSION="${{ inputs.version }}"
            PUBLISH="${{ inputs.publish }}"
            DEBUG="${{ inputs.debug }}"
          fi

          if [[ -z "${VERSION}" ]]; then
            VERSION="0.0.0-ci"
          fi

          if [[ "${PUBLISH}" == "true" && "${VERSION}" == "0.0.0-ci" ]]; then
            echo "::error::Provide a version when publishing a desktop build."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "debug=${DEBUG}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --draft \
              --title "OpenHR PH ${{ steps.version.outputs.version }}" \
              --notes "Desktop build ${{ steps.version.outputs.version }}."

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: mac
            arch: arm64
          - runner: macos-latest
            platform: mac
            arch: x64
          - runner: windows-latest
            platform: win
            arch: x64
          - runner: ubuntu-latest
            platform: linux
            arch: x64
    env:
      APP_ENV: production
      # Kept false on purpose: NativePHP treats app.debug as a development run
      # and would keep the SQLite database, uploads and logs inside the app
      # bundle instead of the per-user app-data folder. DESKTOP_DEBUG turns on
      # error pages and DevTools at runtime instead (see config/desktop.php).
      APP_DEBUG: false
      DESKTOP_DEBUG: ${{ needs.prepare.outputs.debug }}
      NATIVEPHP_APP_VERSION: ${{ needs.prepare.outputs.version }}
      GITHUB_OWNER: kawayanmedia
      GITHUB_REPO: openhrph
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signing is optional. Add CSC_LINK/CSC_KEY_PASSWORD (and the Apple or
      # Azure variables) as repository secrets to sign and notarise builds.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      NATIVEPHP_APPLE_ID: ${{ secrets.NATIVEPHP_APPLE_ID }}
      NATIVEPHP_APPLE_ID_PASS: ${{ secrets.NATIVEPHP_APPLE_ID_PASS }}
      NATIVEPHP_APPLE_TEAM_ID: ${{ secrets.NATIVEPHP_APPLE_TEAM_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      NATIVEPHP_AZURE_PUBLISHER_NAME: ${{ secrets.NATIVEPHP_AZURE_PUBLISHER_NAME }}
      NATIVEPHP_AZURE_ENDPOINT: ${{ secrets.NATIVEPHP_AZURE_ENDPOINT }}
      NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME }}
      NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # exif is a build-time requirement of spatie/image and
          # spatie/laravel-medialibrary. The runner images enable it by default
          # except on Windows, and the bundled PHP binary never has it.
          extensions: bcmath, ctype, curl, dom, exif, fileinfo, gd, iconv, intl, mbstring, openssl, pdo_sqlite, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zip, zlib
          coverage: none
          ini-values: memory_limit=512M

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Prepare environment
        shell: bash
        run: cp .env.example .env

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php-8.4-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      # NativePHP copies .env into the app, so runtime settings have to be in
      # the file rather than exported to the build. Every `php artisan` call
      # also needs vendor/autoload.php, so this runs after Composer.
      - name: Configure the bundled environment
        shell: bash
        env:
          # Optional. Set the same key in every release so upgrades keep users
          # signed in. Generate one with `php artisan key:generate --show`.
          DESKTOP_APP_KEY: ${{ secrets.DESKTOP_APP_KEY }}
        run: |
          php artisan key:generate --ansi --force

          if [[ -n "${DESKTOP_APP_KEY:-}" ]]; then
            sed -i.bak "s|^APP_KEY=.*|APP_KEY=${DESKTOP_APP_KEY}|" .env
            rm -f .env.bak
          fi

          # .env.example is a development profile; the packaged app is not.
          # APP_DEBUG stays false for the per-user paths; DESKTOP_DEBUG is
          # toggled by the workflow input so testers see the real error.
          sed -i.bak \
            -e "s|^APP_ENV=.*|APP_ENV=production|" \
            -e "s|^APP_DEBUG=.*|APP_DEBUG=false|" \
            -e "s|^DESKTOP_DEBUG=.*|DESKTOP_DEBUG=${{ needs.prepare.outputs.debug }}|" \
            .env
          rm -f .env.bak

          echo "Bundled .env: $(grep -E '^(APP_ENV|APP_DEBUG|DESKTOP_DEBUG)=' .env | tr '\n' ' ')"

      - name: Install NativePHP
        run: php artisan native:install --no-interaction

      - name: Ensure the Electron runtime
        shell: bash
        run: node vendor/nativephp/desktop/resources/electron/node_modules/electron/install.js

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fakeroot

      - name: Build application
        shell: bash
        run: |
          PUBLISH=""
          if [[ "${{ needs.prepare.outputs.publish }}" == "true" ]]; then
            PUBLISH="--publish"
          fi

          php artisan native:build ${{ matrix.platform }} ${{ matrix.arch }} $PUBLISH --no-interaction

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openhrph-${{ matrix.platform }}-${{ matrix.arch }}
          path: nativephp/electron/dist/*
          if-no-files-found: error
          retention-days: 14
