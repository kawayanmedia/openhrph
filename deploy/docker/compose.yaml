name: hris

x-app: &app
  image: ${APP_IMAGE:-hris:local}
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
    args:
      APP_VERSION: ${APP_VERSION:-dev}
  env_file:
    - .env
  volumes:
    - hris-storage:/var/www/html/storage
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  init:
    <<: *app
    restart: "no"
    command: ["/usr/local/bin/hris-bootstrap-db"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    command: ["php-fpm", "-F"]
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    <<: *app
    command: ["nginx", "-g", "daemon off;"]
    environment:
      NGINX_PORT: "80"
      PHP_FPM_HOST: "app"
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=600", "--max-time=3600"]
    depends_on:
      init:
        condition: service_completed_successfully
    stop_grace_period: 90s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      init:
        condition: service_completed_successfully

  reverb:
    <<: *app
    profiles: ["reverb"]
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_HOST_PORT:-8081}:8080"
    depends_on:
      init:
        condition: service_completed_successfully

  db:
    image: mysql:8.4
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hris}
      MYSQL_USER: ${DB_USERNAME:-hris}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: Asia/Manila
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - hris-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hris-storage:
  hris-db:
